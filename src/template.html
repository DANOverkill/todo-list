<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="projects_column">
        <nav id="projects_menue">
            <button id="newProject">New Project</button>
            <button id="editProject">Edit Project</button>
            <button id="deleteProject">Delete Project</button>
        </nav>
        <div id="project_content"></div>
    </div>
    <div id="projectTodo-column"></div>
    <form id="addTodo-form">

        <label for=todoName">Todo name:</label><br>
        <input type="text" id="todoName" name="todoName"><br>
        <label for="dueDate">Due Date:</label><br>
        <input type="date" id="dueDate"><br>
        <label for="todoInfo">Info:</label><br>
        <input type="text" id="todoInfo" name="todoInfo"><br><br>
        <input type="submit" value="Submit" id="submitTodoInfo">

    </form>
</body>
</html>
